[project]
name = "k8s-mcp-mvp"
version = "0.1.0"
description = "MVP Kubernetes MCP server with SRE-focused web UI"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.9.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "jinja2>=3.1.0",
  "kubernetes>=30.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
