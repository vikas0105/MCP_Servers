<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K8s SRE Copilot MVP</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main>
      <h1>Kubernetes SRE Copilot (MVP)</h1>
      <section class="controls">
        <label>Namespace <input id="namespace" list="namespaces" value="default" /></label>
        <datalist id="namespaces"></datalist>
        <label>Label selector <input id="selector" placeholder="app=my-service" /></label>
        <button id="refreshBtn">Refresh</button>
      </section>

      <section>
        <h2>Cluster Health Summary</h2>
        <pre id="summary">Loading...</pre>
      </section>

      <section>
        <h2>Contexts</h2>
        <pre id="contexts">Loading...</pre>
      </section>

      <section>
        <h2>Nodes</h2>
        <table id="nodeTable"><thead><tr><th>Name</th><th>Ready</th><th>Kubelet</th><th>OS</th></tr></thead><tbody></tbody></table>
      </section>

      <section>
        <h2>Pods</h2>
        <table id="podsTable"><thead><tr><th>Name</th><th>Phase</th><th>Restarts</th><th>Pod IP</th><th>Node</th></tr></thead><tbody></tbody></table>
      </section>

      <section>
        <h2>Deployments</h2>
        <table id="depTable"><thead><tr><th>Name</th><th>Ready</th><th>Desired</th><th>Updated</th><th>Available</th><th>Action</th></tr></thead><tbody></tbody></table>
      </section>

      <section>
        <h2>Recent Events</h2>
        <ul id="events"></ul>
      </section>
      <p id="status"></p>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
