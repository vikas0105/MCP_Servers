name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  checkout:
    name: Checkout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Upload source artifact
        uses: actions/upload-artifact@v5
        with:
          name: source
          path: .

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Download source artifact
        uses: actions/download-artifact@v5
        with:
          name: source
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Build validation (compile)
        run: python -m py_compile src/*.py

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download source artifact
        uses: actions/download-artifact@v5
        with:
          name: source
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit tests
        run: pytest -q

  dockerize:
    name: Dockerize
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Download source artifact
        uses: actions/download-artifact@v5
        with:
          name: source
          path: .

      - name: Build Docker image
        run: docker build -t k8s-mcp-mvp:ci .
